spring.application.name=chatbot
server.port=8081
# ── LM Studio (OpenAI-compatible local server) ────────────────────────────────
spring.ai.openai.base-url=http://localhost:1234/v1
spring.ai.openai.api-key=lm-studio
spring.ai.openai.chat.options.model=${LM_STUDIO_MODEL:qwen/qwen3-4b-2507}
spring.ai.openai.chat.options.temperature=0.2
app.chat.max-tokens=700

# ── CORS (backend-to-backend call from dispo-tpme-back) ──────────────────────
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}

# ── Lightweight document context ─────────────────────────────────────────────
app.documents.storage-path=${DOCUMENTS_STORAGE_PATH:./data/documents.json}
app.documents.max-context-chars=${DOCUMENTS_MAX_CONTEXT_CHARS:3500}
